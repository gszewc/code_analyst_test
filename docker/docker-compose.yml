version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: code_analyst_backend:latest
    container_name: code_analyst_backend
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      SQLITE_PATH: data/projects.sqlite
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_STARTUP_TIMEOUT: 90
      NEO4J_STARTUP_RETRY_DELAY: 2
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE: 20971520
      LOG_LEVEL: INFO
      LOG_FILE: logs/app.log
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      APP_NAME: Legacy Code Analysis API
      APP_VERSION: 0.1.0
      DEBUG: "false"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - code_analyst_network

  neo4j:
    #image: neo4j:5.15.0-community
    image: docker.io/library/neo4j:5.17-community
    container_name: code_analyst_neo4j
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - code_analyst_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: code_analyst_frontend:latest
    container_name: code_analyst_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      API_BASE_URL: http://backend:8080
    networks:
      - code_analyst_network

volumes:
  backend_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  neo4j_data:
    driver: local

networks:
  code_analyst_network:
    driver: bridge
